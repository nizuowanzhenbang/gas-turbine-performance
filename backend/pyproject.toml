[project]
name = "gas-turbine-performance"
version = "1.0.0"
description = "Gas Turbine & Combined Cycle Performance Monitoring System"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.3",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "python-multipart==0.0.12",
    "apscheduler==3.10.4",
    "httpx==0.27.2",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "numpy==2.1.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/seed_data.py"]
